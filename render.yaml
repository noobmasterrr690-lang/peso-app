services:
  - type: web
    name: peso-app
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run deploy:build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
